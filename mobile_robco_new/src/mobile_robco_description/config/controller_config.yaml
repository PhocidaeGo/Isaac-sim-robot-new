# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    aiina_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    aiina_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    aiina_lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    aiina_lifted_arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

aiina_controller:
  ros__parameters:
    joints:
      - Slider_18
      - robco_joint_0
      - robco_joint_1
      - robco_joint_2
      - robco_joint_3
      - robco_joint_4
      - robco_joint_5
    command_interfaces:
      - position
      - velocity
      - acceleration
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

    gains:
      Slider_18: { p: 100.0, d: 0.0, i: 10.0 }      # Need to tune this
      robco_joint_0: { p: 100.0, d: 0.0, i: 10.0 }
      robco_joint_1: { p: 100.0, d: 0.0, i: 10.0 }
      robco_joint_2: { p: 100.0, d: 0.0, i: 10.0 }
      robco_joint_3: { p: 100.0, d: 0.0, i: 10.0 }
      robco_joint_4: { p: 100.0, d: 0.0, i: 10.0 }
      robco_joint_5: { p: 100.0, d: 0.0, i: 10.0 }


aiina_arm_controller:
  ros__parameters:
    joints:
      - robco_joint_0
      - robco_joint_1
      - robco_joint_2
      - robco_joint_3
      - robco_joint_4
      - robco_joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

aiina_lift_controller:
  ros__parameters:
    joints:
      - Slider_18
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

aiina_lifted_arm_velocity_controller:
  ros__parameters:
    joints:
      - Slider_18
      - robco_joint_0
      - robco_joint_1
      - robco_joint_2
      - robco_joint_3
      - robco_joint_4
      - robco_joint_5